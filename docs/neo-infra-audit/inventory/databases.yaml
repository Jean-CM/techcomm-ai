homelab:
  - id: neo-postgres
    engine: postgres:16-alpine
    role: n8n backing store
    host: dockerhost
    network_exposure: internal-only   # GOOD
    criticality: CRITICAL
    backup: NONE
    restore_tested: NEVER

  - id: neo-studio-db
    engine: postgres:16-alpine
    role: NEO Studio (viral + analyst)
    host: dockerhost
    network_exposure: internal-only   # GOOD
    criticality: CRITICAL
    migrations_applied_by: neo-studio-migrate (idempotent psql ON_ERROR_STOP)
    backup: NONE
    restore_tested: NEVER

  - id: neo-redis
    engine: redis:7-alpine
    persistence: appendonly
    consumer: NONE_FOUND
    status: POSSIBLY_ORPHANED
    backup: NONE

  - id: neo-minio
    engine: minio object storage
    bucket: neo-studio
    anonymous_access: none   # GOOD - explicitly set
    backup: NONE

