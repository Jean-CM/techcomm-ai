name: Refresh npm lockfile

on:
  push:
    branches:
      - lockfile-refresh-2026-08-09

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Switch to exact current main
        run: |
          git fetch origin main
          git switch --detach origin/main

      - name: Regenerate lockfile safely
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "Techcomm Security Bot"
          git config user.email "security-bot@techcomm.local"
          git add package-lock.json
          git commit -m "chore: refresh dependency lockfile after security patches"
          git push origin HEAD:main
